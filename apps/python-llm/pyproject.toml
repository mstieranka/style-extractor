[project]
name = "style-extractor-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.3",
  "gradio[oauth]==6.3.0",
  "transformers==5.0.0",
  "accelerate<2,>=0.26",
  "huggingface-hub<2,>=1.3.3",
  "safetensors>=0.4",
  "bitsandbytes>=0.43",
  "triton>=3.4.0; platform_system == 'Linux'",
  "kernels",
  "sentencepiece",
  "protobuf",
  "pillow",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
